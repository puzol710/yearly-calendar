<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annual Calendar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <main class="content full">
        <header class="topbar">
          <div class="year-group">
            <div class="year-title" id="yearTitle"></div>
            <div class="category-pill-row">
              <div class="category-label">Categories</div>
              <div id="categoryPills" class="category-pills"></div>
              <button id="categoryToggleAll" type="button" class="category-pill edit">
                Select All
              </button>
              <button id="categoryEditBtn" type="button" class="category-pill edit">
                Edit
              </button>
            </div>
            <div class="category-filter-mobile">
              <button id="categoryFilterBtnMobile" type="button" class="category-pill">
                Categories
              </button>
            </div>
          </div>
          <div class="top-actions">
            <button id="addEventBtn" type="button" class="icon-button" aria-label="Add event">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <button id="shareBtn" type="button" class="icon-button" aria-label="Share">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
              </svg>
            </button>
            <button id="settingsBtn" type="button" class="icon-button" aria-label="Settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </button>
            <button id="userBtn" type="button" class="icon-button" aria-label="Account">
              <span id="userAvatar" class="user-avatar">JD</span>
            </button>
          </div>
        </header>
        <div id="viewOnlyBanner" class="view-only-banner hidden">
          View-only mode: you can view events but cannot edit this calendar.
        </div>

        <section class="calendar">
          <div class="weekday-row" id="weekdayRow"></div>
          <div class="months" id="monthRows"></div>
        </section>
      </main>
    </div>

    <div id="historyDrawer" class="history-drawer" aria-hidden="true">
      <div class="history-panel">
        <div class="history-header">
          <div>
            <div class="panel-title">Event History</div>
            <div id="historyTitle" class="history-subtitle"></div>
          </div>
          <button id="historyClose" type="button" class="auth-button">Close</button>
        </div>
        <div id="historyBody" class="history-body"></div>
      </div>
    </div>

    <div id="eventPopup" class="event-popup" aria-hidden="true">
      <div class="event-popup-card">
        <div id="eventPopupView" class="event-popup-view">
          <div class="event-popup-title" id="eventPopupTitle"></div>
          <div class="event-popup-meta" id="eventPopupMeta"></div>
          <div class="event-popup-desc" id="eventPopupDesc"></div>
          <div class="event-popup-actions"></div>
        </div>
        <form id="eventPopupForm" class="event-popup-form">
          <label class="field">
            <span>Title</span>
            <input id="eventPopupTitleInput" type="text" required />
          </label>
          <label class="field">
            <span>Category</span>
            <select id="eventPopupCategory"></select>
          </label>
          <label class="field checkbox">
            <input id="eventPopupAllDay" type="checkbox" checked />
            <span>All-day</span>
          </label>
          <div class="grid-2">
            <label class="field">
              <span>Start date</span>
              <input id="eventPopupStartDate" type="date" required />
            </label>
            <label class="field time-field">
              <span>Start time</span>
              <input id="eventPopupStartTime" type="time" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>End date</span>
              <input id="eventPopupEndDate" type="date" required />
            </label>
            <label class="field time-field">
              <span>End time</span>
              <input id="eventPopupEndTime" type="time" />
            </label>
          </div>
          <label class="field">
            <span>Time zone</span>
            <select id="eventPopupTimeZone"></select>
          </label>
          <div class="panel-subtitle">Recurrence</div>
          <label class="field">
            <span>Frequency</span>
            <select id="eventPopupRecurrence">
              <option value="none">None</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </label>
          <div class="grid-2">
            <label class="field">
              <span>Interval</span>
              <input id="eventPopupInterval" type="number" min="1" value="1" />
            </label>
            <label class="field">
              <span>Until</span>
              <input id="eventPopupUntil" type="date" />
            </label>
          </div>
          <div id="eventPopupWeekdays" class="weekday-picker">
            <label><input type="checkbox" value="1" />Mon</label>
            <label><input type="checkbox" value="2" />Tue</label>
            <label><input type="checkbox" value="3" />Wed</label>
            <label><input type="checkbox" value="4" />Thu</label>
            <label><input type="checkbox" value="5" />Fri</label>
            <label><input type="checkbox" value="6" />Sat</label>
            <label><input type="checkbox" value="0" />Sun</label>
          </div>
          <label class="field">
            <span>Description</span>
            <textarea id="eventPopupDescription" rows="3"></textarea>
          </label>
          <div class="event-popup-actions">
            <button id="eventPopupSave" type="submit">Save</button>
            <button id="eventPopupCancel" type="button" class="ghost">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="categoryManagerPopup" class="event-popup" aria-hidden="true">
      <div class="event-popup-card category-manager-card">
        <div class="event-popup-title">Manage Categories</div>
        <div class="popup-category-list" id="categoryManagerList"></div>
        <div class="popup-category-create">
          <input
            id="categoryManagerName"
            type="text"
            placeholder="New category name"
          />
          <input
            id="categoryManagerColor"
            type="color"
            value="#c97b84"
          />
          <button id="categoryManagerCreate" type="button">Create</button>
        </div>
        <div class="event-popup-actions">
          <button id="categoryManagerClose" type="button" class="ghost">
            Close
          </button>
        </div>
      </div>
    </div>

    <div id="settingsPopup" class="event-popup" aria-hidden="true">
      <div class="event-popup-card">
        <div class="event-popup-title">Settings</div>
        <div class="panel-subtitle">Calendar</div>
        <label class="field">
          <span>Calendar name</span>
          <input id="calendarNameInput" type="text" />
        </label>
        <label class="field checkbox">
          <input id="defaultCalendarToggle" type="checkbox" />
          <span>Make this my default calendar</span>
        </label>
        <button id="saveCalendarSettings" type="button">Save Calendar Settings</button>
        <button id="openCalendarPicker" type="button" class="ghost">
          Switch Calendar
        </button>
        <label class="field">
          <span>Year</span>
          <input id="yearInput" type="number" min="1970" max="2100" />
        </label>
        <label class="field">
          <span>Time zone</span>
          <select id="displayTimeZone"></select>
        </label>
        <div class="panel-subtitle">Shared With</div>
        <div id="sharedWithList" class="shared-with-list"></div>
        <button id="deleteCalendarBtn" type="button" class="danger">
          Delete Calendar
        </button>
        <button id="settingsClose" type="button" class="ghost">Close</button>
      </div>
    </div>

    <div id="sharePopup" class="event-popup" aria-hidden="true">
      <div class="event-popup-card">
        <div class="event-popup-title">Share Calendar</div>
        <label class="field">
          <span>Permission</span>
          <select id="shareRole">
            <option value="viewer">Viewer</option>
            <option value="editor">Editor</option>
          </select>
        </label>
        <div class="event-popup-actions">
          <button id="shareSend" type="button">Copy Invite Link</button>
          <button id="shareClose" type="button" class="ghost">Close</button>
        </div>
      </div>
    </div>

    <div id="categoryFilterPopup" class="event-popup" aria-hidden="true">
      <div class="event-popup-card category-filter-card">
        <div class="event-popup-title">Filter Categories</div>
        <div id="categoryFilterList" class="category-filter-list"></div>
        <div class="event-popup-actions">
          <button id="categoryFilterToggleAll" type="button" class="ghost">Select All</button>
          <button id="categoryFilterEdit" type="button" class="ghost">Edit</button>
          <button id="categoryFilterClose" type="button" class="ghost">Close</button>
        </div>
      </div>
    </div>

    <div id="userDrawer" class="history-drawer user-drawer" aria-hidden="true">
      <div class="history-panel user-panel">
        <div class="history-header">
          <div>
            <div class="panel-title">Account</div>
            <div id="userLabel" class="history-subtitle">Not signed in</div>
          </div>
          <button id="userClose" type="button">Close</button>
        </div>
        <div class="auth-row">
          <button id="signInBtn" type="button">Sign in with Google</button>
          <button id="signOutBtn" type="button" class="ghost" disabled>
            Sign out
          </button>
        </div>
      </div>
    </div>

    <div id="authGate" class="gate hidden">
      <div class="gate-card">
        <div class="gate-title">Welcome to Annual Calendar</div>
        <div class="gate-sub">Sign in to manage calendars.</div>
        <button id="gateSignIn" type="button">Sign in with Google</button>
      </div>
    </div>

    <div id="calendarPicker" class="gate hidden">
      <div class="gate-card wide">
        <div class="gate-title">Select a Calendar</div>
        <div id="calendarList" class="calendar-list"></div>
        <div class="gate-divider"></div>
        <label class="field">
          <span>New calendar name</span>
          <input id="newCalendarName" type="text" placeholder="My Calendar" />
        </label>
        <button id="createCalendarBtn" type="button">Create Calendar</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
